name: Deploy to Beget

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: 93.189.228.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/site_torpie
            git fetch --all
            git reset --hard origin/main
            # Если у тебя Flask:
            pkill -f app.py || true
            nohup python3 app.py > log.txt 2>&1 &