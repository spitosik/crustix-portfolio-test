<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crustix - Магазин</title>
    <link rel="stylesheet" href="css/shop.css">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="content">
        <div class="header">
            <button onclick="window.location.href='index.html';" class="main-btn">
                ГЛАВНАЯ
            </button>
            <button onclick="window.location.href='shop.html';" class="shop-btn">
                МАГАЗИН
            </button>
            <button class="support-btn"> 
                ПOДДЕРЖKА
            </button>
        </div>
        <div class="main-content">
            <div class="shop-container">
                <div class="premium-dnt">
                    <p class="premium-dnt-text">Премиум</p>
                    <img src="img/Premium.png" class="premium-dnt-img">
                    <button class="buy-btn">59 РУБ.</button>
                </div>
                <div class="amnisty-dnt">
                    <p class="amnisty-dnt-text">Амнистия</p>
                    <img src="img/Amnisty.png" class="amnisty-dnt-img">
                    <button class="buy-btn">39 РУБ.</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
